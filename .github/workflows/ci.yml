name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

jobs:
  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` runs `tsc` first, then `vite build`.
      - run: npm run build
      # The icons have silently shipped blank twice; assert they are not.
      - run: node scripts/verify_icon_png.mjs

  backend:
    name: Backend check & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format check
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Test
        run: cargo test
        working-directory: src-tauri

  build:
    name: Tauri build (Windows)
    runs-on: windows-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend deps
        run: npm ci
      # `tauri` is a devDependency, so `npx` resolves the pinned CLI version.
      # CI only verifies that installers can be produced: updater artifacts
      # require the release signing key, so they are disabled for this job
      # (release builds use the default config plus TAURI_SIGNING_PRIVATE_KEY).
      - name: Build
        run: npx tauri build --config src-tauri/tauri.ci.conf.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mem-reduct-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
